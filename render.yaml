# Render deployment blueprint for the Web Scraper App.
# Docs: https://render.com/docs/blueprint-spec
#
# How to use (no coding required):
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com  ->  New  ->  Blueprint.
#   3. Connect this repository. Render reads this file automatically.
#   4. Click "Apply" and wait for the first deploy to finish.
#   5. Open the URL Render gives you (e.g. https://web-scraper-app.onrender.com).

services:
  - type: web
    name: web-scraper-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker + threads keeps background scraping jobs inside a single process.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT 'app:create_app()'
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      # A strong secret key is generated automatically by Render.
      - key: SECRET_KEY
        generateValue: true
